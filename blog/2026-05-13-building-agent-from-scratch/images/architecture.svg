<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" font-family="ui-monospace, 'Cascadia Code', monospace">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <!-- background -->
  <rect width="720" height="430" fill="#f8fafc"/>

  <!-- ── FRONTEND ── -->
  <rect x="24" y="20" width="672" height="68" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="360" y="46" text-anchor="middle" font-size="13" font-weight="700" fill="#1e40af">FRONTEND</text>
  <text x="360" y="66" text-anchor="middle" font-size="11" fill="#1d4ed8">Vue 3 + Vite · served by nginx · communicates via REST API + SSE streaming</text>

  <!-- arrow -->
  <line x1="360" y1="88" x2="360" y2="112" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ── API LAYER ── -->
  <rect x="24" y="112" width="672" height="172" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="360" y="136" text-anchor="middle" font-size="13" font-weight="700" fill="#4c1d95">API LAYER — Flask + LangGraph</text>

  <!-- IngestPipeline sub-box -->
  <rect x="48" y="148" width="294" height="116" rx="6" fill="#f5f3ff" stroke="#a78bfa" stroke-width="1"/>
  <text x="195" y="170" text-anchor="middle" font-size="12" font-weight="600" fill="#5b21b6">IngestPipeline</text>
  <text x="195" y="190" text-anchor="middle" font-size="10" fill="#7c3aed">Source Router → Fetch → Clean</text>
  <text x="195" y="207" text-anchor="middle" font-size="10" fill="#7c3aed">Chunk → Embed → Store</text>
  <line x1="80" y1="220" x2="310" y2="220" stroke="#c4b5fd" stroke-width="0.8" stroke-dasharray="3,3"/>
  <text x="195" y="237" text-anchor="middle" font-size="10" fill="#8b5cf6">deterministic pipeline</text>
  <text x="195" y="253" text-anchor="middle" font-size="10" fill="#8b5cf6">file / url / text → vectors</text>

  <!-- QA Agent sub-box -->
  <rect x="378" y="148" width="294" height="116" rx="6" fill="#f5f3ff" stroke="#a78bfa" stroke-width="1"/>
  <text x="525" y="170" text-anchor="middle" font-size="12" font-weight="600" fill="#5b21b6">QA Agent</text>
  <text x="525" y="190" text-anchor="middle" font-size="10" fill="#7c3aed">search_knowledge(query)</text>
  <text x="525" y="207" text-anchor="middle" font-size="10" fill="#7c3aed">search_private(query, user_id)</text>
  <line x1="410" y1="220" x2="640" y2="220" stroke="#c4b5fd" stroke-width="0.8" stroke-dasharray="3,3"/>
  <text x="525" y="237" text-anchor="middle" font-size="10" fill="#8b5cf6">ReAct loop</text>
  <text x="525" y="253" text-anchor="middle" font-size="10" fill="#8b5cf6">question → streamed answer (SSE)</text>

  <!-- arrows down -->
  <line x1="195" y1="284" x2="195" y2="310" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="360" y1="284" x2="360" y2="310" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="525" y1="284" x2="525" y2="310" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ── DATA LAYER ── -->
  <rect x="24" y="310" width="672" height="100" rx="8" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/>
  <text x="360" y="332" text-anchor="middle" font-size="13" font-weight="700" fill="#064e3b">DATA LAYER</text>

  <!-- Qdrant -->
  <rect x="48" y="342" width="196" height="48" rx="5" fill="#f0fdf4" stroke="#6ee7b7" stroke-width="1"/>
  <text x="146" y="361" text-anchor="middle" font-size="11" font-weight="600" fill="#065f46">Qdrant</text>
  <text x="146" y="379" text-anchor="middle" font-size="10" fill="#047857">knowledge · private (vectors)</text>

  <!-- SQLite -->
  <rect x="262" y="342" width="196" height="48" rx="5" fill="#f0fdf4" stroke="#6ee7b7" stroke-width="1"/>
  <text x="360" y="361" text-anchor="middle" font-size="11" font-weight="600" fill="#065f46">SQLite</text>
  <text x="360" y="379" text-anchor="middle" font-size="10" fill="#047857">metadata · source of truth</text>

  <!-- Uploads -->
  <rect x="476" y="342" width="196" height="48" rx="5" fill="#f0fdf4" stroke="#6ee7b7" stroke-width="1"/>
  <text x="574" y="361" text-anchor="middle" font-size="11" font-weight="600" fill="#065f46">Uploads</text>
  <text x="574" y="379" text-anchor="middle" font-size="10" fill="#047857">raw files · permanently kept</text>

  <!-- caption -->
  <text x="360" y="422" text-anchor="middle" font-size="10" fill="#94a3b8">Qdrant is internal-only — no host port binding · SQLite commits before every Qdrant write</text>
</svg>
